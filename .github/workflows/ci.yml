name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything. Say so, rather than inheriting whatever the
# repository default happens to be.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # .ruby-version is the Ruby releases are built with. The numbered
        # entries cover the range the gemspec claims to support.
        ruby: [".ruby-version", "3.2", "3.3", "3.4"]

    name: Ruby ${{ matrix.ruby }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Test suite
        run: bundle exec rake
