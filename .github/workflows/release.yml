name: Release

# Publishes the gem when the version in lib/ruby_decision_model/version.rb is not yet on
# RubyGems, using trusted publishing: GitHub hands RubyGems a short-lived OIDC
# token and RubyGems hands back a short-lived API key. No stored secret, no API
# key in the repo, and no MFA prompt.
#
# This workflow is the identity RubyGems trusts, so its FILENAME is part of the
# trust configuration. Renaming this file breaks publishing until the gem's
# trusted publisher is updated to match (docs: guides.rubygems.org/trusted-publishing).
#
# Two ways to release. Bump version.rb and land it on main, and the push
# trigger below publishes it. Or run the workflow by hand. Either way a version
# already on RubyGems is skipped before any credentials are fetched, so a
# re-run, or a push that touched version.rb without changing the number, is
# a no-op.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "lib/**/version.rb"

jobs:
  release:
    runs-on: ubuntu-latest

    # A GitHub environment lets you require a review before anything reaches
    # RubyGems, and it is the second half of the trusted publisher's identity.
    # The publisher registered on rubygems.org names this environment, so
    # renaming it breaks publishing the same way renaming the file does.
    environment: release

    permissions:
      contents: read
      # The OIDC token this exchanges for a RubyGems API key. Publishing fails
      # without it, and the failure looks like an ordinary auth error.
      id-token: write

    steps:
      # Actions are pinned to commit SHAs, not tags. This job holds
      # id-token: write, so every step in it can ask GitHub for the OIDC
      # token that RubyGems trades for a publishing key. A tag is a mutable
      # pointer; whoever can move it can change what runs here. The trailing
      # comment is the version the SHA was, for whoever bumps it next.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          # The job never pushes, and a token left in .git/config is one more
          # thing a later step could pick up.
          persist-credentials: false

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # A release that cannot pass its own suite is not a release. CI already
      # ran this on the commit; running it again here costs a minute and
      # removes the "which commit did we actually build" question.
      - name: Test suite
        run: bundle exec rake test

      # --strict escalates any gemspec warning to a build failure, and the
      # build is what proves the gemspec's file list is what we think it is.
      - name: Build the gem
        run: bundle exec rake release:build

      # The gem must carry every .rb file lib/ holds. A gemspec whose files
      # list has drifted builds happily and installs broken, so the diff is
      # asserted here rather than discovered by whoever runs gem install.
      - name: Built gem carries its full file list
        run: |
          gem_file=$(ls pkg/*.gem)
          dir=$(mktemp -d)
          tar -xf "$gem_file" -C "$dir"
          tar -tzf "$dir/data.tar.gz" | grep '\.rb$' | sort > "$dir/packaged.txt"
          find lib -name '*.rb' | sort > "$dir/checkout.txt"
          missing=$(comm -13 "$dir/packaged.txt" "$dir/checkout.txt")
          if [ -n "$missing" ]; then
            echo "::error::$(basename "$gem_file" .gem) is missing files that exist in lib:"
            echo "$missing" | sed 's/^/    /'
            exit 1
          fi

      # Decides whether there is anything to publish before touching
      # credentials, so a no-op run never needs the trusted publisher at all.
      - name: Is this version already on RubyGems?
        id: check
        run: |
          # Take the one line that is the answer, not whatever else reached
          # stdout. Today there is nothing else -- rake prints the one line
          # and bundler's warnings go to stderr -- but this decides whether
          # credentials are fetched and a gem is pushed, and GITHUB_OUTPUT is
          # parsed as key=value lines. Anchoring it costs nothing and turns a
          # surprise into a failed step.
          status=$(bundle exec rake release:status | grep -Ex 'publish=(true|false)' | tail -n 1)
          if [ -z "$status" ]; then
            echo "::error::rake release:status printed no publish=true or publish=false line"
            exit 1
          fi
          echo "$status"
          echo "$status" >> "$GITHUB_OUTPUT"

      # Exchanges the OIDC token for a short-lived RubyGems API key and writes
      # it where `gem push` looks. The gem must list this repo, this workflow
      # file, and the release environment as a trusted publisher on RubyGems.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        if: steps.check.outputs.publish == 'true'

      - name: Push to RubyGems
        if: steps.check.outputs.publish == 'true'
        run: bundle exec rake release:push
